services:
  - type: web
    name: sarvam-check
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: job progress lives in process memory, so every request must hit the same process.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_CHAT_MODEL
        value: sarvam-105b
      - key: DOC_LANGUAGE
        value: en-IN
      - key: MAX_WORKERS
        value: "4"
